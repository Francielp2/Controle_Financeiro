{% extends "base.html" %}

{% block title %}Criar conta{% endblock %}

{% block content %}
    <h2>Criar conta</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Criar conta</button>
    </form>

    <p>
        Já tem conta?
        <a href="{% url 'usuarios:login' %}">Entrar</a>
    </p>
{% endblock %}
