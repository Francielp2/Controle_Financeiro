{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Controle Financeiro{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/tabler/css/tabler.min.css' %}">
</head>
<body>
    <script src="{% static 'vendor/tabler/js/tabler-theme.min.js' %}"></script>
    <div class="page">
        {% include "partials/navegacao_tabler.html" %}

        <div class="page-wrapper">
            <main class="page-body">
                <div class="container-xl">
                    {% for message in messages %}
                        <div class="alert alert-info" role="alert">{{ message }}</div>
                    {% endfor %}

                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>
    <script src="{% static 'vendor/tabler/js/tabler.min.js' %}" defer></script>
</body>
</html>
