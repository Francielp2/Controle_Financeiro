<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Controle Financeiro{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        nav a {
            margin-right: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        .mensagem {
            padding: 10px;
            margin: 10px 0;
            background: #eeeeee;
        }

        .acoes a {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <h1>Controle Financeiro</h1>

    <nav>
        <a href="{% url 'financeiro:inicio' %}">Início</a>
        <a href="{% url 'usuarios:usuario_listar' %}">Usuários</a>
        <a href="{% url 'financeiro:conta_listar' %}">Contas</a>
        <a href="{% url 'financeiro:categoria_listar' %}">Categorias</a>
        <a href="{% url 'financeiro:compromisso_listar' %}">
            Compromissos
        </a>
        <a href="{% url 'financeiro:movimentacao_listar' %}">
            Movimentações
        </a>
    </nav>

    <hr>

    {% for message in messages %}
        <div class="mensagem">
            {{ message }}
        </div>
    {% endfor %}

    {% block content %}
    {% endblock %}
</body>
</html>
