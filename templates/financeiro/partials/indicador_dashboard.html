{% comment %}Base: cartões de resumo card-sm da demo horizontal do Tabler.{% endcomment %}
<div class="col-6 col-lg-3">
    <div class="card card-sm position-relative">
        <div class="card-body">
            <div class="text-secondary">{{ titulo }}</div>
            <div class="h2 text-primary mb-0">{{ valor }}</div>
        </div>
        {% if periodo %}
            <span class="badge bg-primary-lt position-absolute top-0 end-0 translate-middle-y me-2">{{ periodo }}</span>
        {% endif %}
    </div>
</div>
